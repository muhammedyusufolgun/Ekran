<!doctype html><html lang="tr"><meta charset="utf-8"><title>Monitor - Ekran Gönder</title><style>body{font:18px Arial;max-width:650px;margin:45px auto}input,button{font-size:18px;padding:12px;margin:8px}#status{white-space:pre-wrap}</style><h2>Monitor — Windows Ekranını Gönder</h2><p>Bu dosyayı Chrome veya Edge ile yerel dosya olarak açın. Telefon ve bilgisayar aynı Wi-Fi ağında olmalıdır.</p><label>Telefon IP adresi: <input id="ip" placeholder="192.168.1.25"></label><br><button id="start">Ekranı paylaş</button><button id="stop">Durdur</button><p id="status">Hazır.</p><video id="preview" autoplay muted playsinline style="max-width:100%"></video><script>
let stream=null,active=false;const status=document.querySelector('#status'),video=document.querySelector('#preview');
document.querySelector('#start').onclick=async()=>{
try{
if(!window.isSecureContext)throw Error('Güvenli bağlam gerekli: HTML dosyasını file:// olarak açın.');
const ip=document.querySelector('#ip').value.trim();
if(!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(ip))throw Error('Telefon IP adresini girin.');
stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:8},audio:false});video.srcObject=stream;active=true;status.textContent='Paylaşım başlatıldı. Telefon bağlantısı deneniyor...';
stream.getVideoTracks()[0].onended=()=>{active=false;status.textContent='Ekran paylaşımı durduruldu.'};
const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');let errors=0;
while(active){await new Promise(resolve=>setTimeout(resolve,150));if(video.readyState<2)continue;
const scale=Math.min(1,1280/video.videoWidth,720/video.videoHeight);canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));ctx.drawImage(video,0,0,canvas.width,canvas.height);
const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.65));if(!blob)continue;
try{const res=await fetch('http://'+ip+':48622/frame',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,mode:'cors',signal:AbortSignal.timeout(3000)});if(!res.ok)throw Error('HTTP '+res.status);errors=0;status.textContent='Görüntü gönderiliyor: '+canvas.width+'x'+canvas.height;}catch(e){if(++errors>=3){status.textContent='Bağlantı engellendi: '+e.message+'\nTarayıcı karma içerik veya yerel ağ güvenlik politikası nedeniyle HTTP gönderimini engelliyor olabilir. Bu durumda HTTPS/WebRTC sürümü gerekir.';active=false;}}
}
}catch(e){status.textContent='Hata: '+e.message;}
};
document.querySelector('#stop').onclick=()=>{active=false;stream?.getTracks().forEach(t=>t.stop());status.textContent='Durduruldu.'};
</script></html>
